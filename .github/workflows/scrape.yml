name: Daily Flight Scraper & APIx Generator

on:
  schedule:
    - cron: '0 0 * * *'  # 5:30 AM IST (Economy)
    - cron: '0 6 * * *'  # 11:30 AM IST (Premium Economy)
    - cron: '0 12 * * *' # 5:30 PM IST (Business)
  workflow_dispatch:
    inputs:
      target_class:
        description: 'Target Fare Class to scrape'
        required: true
        default: 'Economy'
        type: choice
        options:
          - Economy
          - Premium Economy
          - Business

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper_requirements.txt
          playwright install chromium
          playwright install-deps
          
      - name: Determine Target Class
        id: set-class
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TARGET_CLASS=${{ github.event.inputs.target_class }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +"%H")
            if [ "$HOUR" == "00" ]; then
              echo "TARGET_CLASS=Economy" >> $GITHUB_ENV
            elif [ "$HOUR" == "06" ]; then
              echo "TARGET_CLASS=Premium Economy" >> $GITHUB_ENV
            elif [ "$HOUR" == "12" ]; then
              echo "TARGET_CLASS=Business" >> $GITHUB_ENV
            else
              echo "TARGET_CLASS=Economy" >> $GITHUB_ENV
            fi
          fi
          
      - name: Run Daily Scraper Orchestrator
        run: |
          # This runs the full scrape across the top 5 routes
          python scrapers/engine/orchestrator.py --full --target-class "${{ env.TARGET_CLASS }}"
          # Run the data cleaning pipeline to deduplicate and impute taxes
          python scrapers/pipeline/clean_data.py
        timeout-minutes: 350
          
      - name: Commit and Push Updated Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add scrapers/engine/flights.db
          
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update: Daily scrape for ${{ env.TARGET_CLASS }}"
          git push
