name: Daily Flight Scraper & APIx Generator

on:
  schedule:
    - cron: '0 1 * * *' # Runs at 1 AM UTC every day
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
          
      - name: Run Daily Scraper Orchestrator
        run: |
          # This runs the scraper, populating flights.db
          python scrapers/engine/orchestrator.py
          
      - name: Commit and Push Updated Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add scrapers/engine/flights.db
          
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update: Daily scrape of flights.db"
          git push
